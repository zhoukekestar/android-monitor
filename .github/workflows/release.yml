name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK and macOS app
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify toolchains
        run: |
          swift --version
          xcodebuild -version
          java -version
          ./gradlew --version -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Run Android unit tests
        run: |
          ./gradlew :android-receiver:testDebugUnitTest \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon

      # Resolve the version BEFORE packaging so the Info.plist gets stamped
      # with the tag version. The auto-updater compares this against the
      # latest release's tag_name to decide whether to prompt.
      - name: Resolve artifact name and version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            NAME="${GITHUB_SHA:0:7}"
            VERSION="0.0.0-${NAME}"  # untagged dev build
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app with bundled Android APK
        env:
          ANDROID_MONITOR_VERSION: ${{ steps.meta.outputs.version }}
          ANDROID_MONITOR_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/package-mac-host-app.sh
          test -s "MacHost/build/Android Monitor Host.app/Contents/Resources/android-receiver-debug.apk"
          test -x "MacHost/build/Android Monitor Host.app/Contents/MacOS/Android Monitor Host"
          test -x "MacHost/build/Android Monitor Host.app/Contents/MacOS/phase0-spike"
          test -x "MacHost/build/Android Monitor Host.app/Contents/MacOS/status-panel-server"
          # Sanity-check the stamped version landed in Info.plist.
          /usr/bin/plutil -extract CFBundleShortVersionString raw \
            "MacHost/build/Android Monitor Host.app/Contents/Info.plist"

      - name: Zip macOS app
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          cd MacHost/build
          ZIP_NAME="Android-Monitor-Host-${NAME}.zip"
          ditto -c -k --keepParent --sequesterRsrc "Android Monitor Host.app" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Monitor-Host-${{ steps.meta.outputs.name }}
          path: |
            MacHost/build/Android-Monitor-Host-*.zip
            MacHost/build/Android-Monitor-Host-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacHost/build/Android-Monitor-Host-*.zip
            MacHost/build/Android-Monitor-Host-*.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 使用方法

            1. 下载 `Android-Monitor-Host-<version>.zip` 并解压。
            2. 打开 `Android Monitor Host.app`。
            3. 用 USB 连接 Android 手机并允许 USB 调试。
            4. 在窗口里选择设备，点击“开始扩展屏”。

            Android 客户端 APK 已经内置在 Mac app 的 `Contents/Resources/android-receiver-debug.apk`，不需要单独下载或手动安装。

            这是未 notarize 的本地签名构建。首次打开如果被 macOS 拦截，请右键 app 选择“打开”，或在系统设置的隐私与安全里允许打开。
