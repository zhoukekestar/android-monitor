plugins {
    id "com.android.application"
    id "jacoco"
}

jacoco {
    toolVersion = "0.8.13"
}

android {
    namespace "com.androidmonitor.receiver"
    compileSdk 36

    defaultConfig {
        applicationId "com.androidmonitor.receiver"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

tasks.register("jacocoDebugUnitTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"

    reports {
        xml.required = true
        html.required = true
    }

    def debugTree = fileTree(
            dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
            includes: [
                    '**/AnnexBInspector*.class',
                    '**/StreamProtocol*.class',
                    '**/StatusSnapshot.class'
            ]
    )

    classDirectories.setFrom(files(debugTree))
    sourceDirectories.setFrom(files("src/main/java"))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
            "jacoco/testDebugUnitTest.exec"
    ]))
}

tasks.register("jacocoDebugCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoDebugUnitTestReport"

    def debugTree = fileTree(
            dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
            includes: [
                    '**/AnnexBInspector*.class',
                    '**/StreamProtocol*.class',
                    '**/StatusSnapshot.class'
            ]
    )

    classDirectories.setFrom(files(debugTree))
    sourceDirectories.setFrom(files("src/main/java"))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
            "jacoco/testDebugUnitTest.exec"
    ]))

    violationRules {
        rule {
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = 0.95
            }
        }
    }
}
