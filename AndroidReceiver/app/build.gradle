plugins {
    id "com.android.application"
}

android {
    namespace "com.androidmonitor.receiver"
    compileSdk 36

    defaultConfig {
        applicationId "com.androidmonitor.receiver"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
